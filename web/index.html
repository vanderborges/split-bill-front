<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Divida despesas em grupo de forma simples.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DividiAi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DividiAi</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Tamanho do texto do iPhone/iPad (Ajustes > Tela e Brilho > Tamanho do
    Texto) também no navegador. O Flutter web usa o tamanho de fonte da
    página (16px = 100%) como escala do texto e percebe quando ele muda; o
    Safari só expõe o tamanho do sistema pela fonte "-apple-system-body"
    (17px no tamanho padrão). Aqui ela é medida e convertida pra escala da
    página. Só no iOS: no Mac a mesma fonte é 13px e encolheria tudo.
  -->
  <script>
    (function () {
      var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS || !window.CSS || !CSS.supports('font', '-apple-system-body')) {
        return;
      }
      var IOS_DEFAULT_BODY_SIZE = 17;
      // Limites pra tela não quebrar nos tamanhos de acessibilidade.
      var MIN_SCALE = 0.85;
      var MAX_SCALE = 1.6;
      function applySystemTextSize() {
        var probe = document.createElement('span');
        probe.style.font = '-apple-system-body';
        probe.style.position = 'absolute';
        probe.style.visibility = 'hidden';
        probe.textContent = 'A';
        (document.body || document.documentElement).appendChild(probe);
        var size = parseFloat(getComputedStyle(probe).fontSize);
        probe.remove();
        if (!size) {
          return;
        }
        var scale = Math.min(MAX_SCALE,
          Math.max(MIN_SCALE, size / IOS_DEFAULT_BODY_SIZE));
        document.documentElement.style.fontSize = (16 * scale) + 'px';
      }
      applySystemTextSize();
      // Mudou o tamanho nos Ajustes e voltou pro navegador.
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          applySystemTextSize();
        }
      });
      window.addEventListener('focus', applySystemTextSize);
    })();
  </script>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then((keys) => {
        for (const key of keys) {
          caches.delete(key);
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
